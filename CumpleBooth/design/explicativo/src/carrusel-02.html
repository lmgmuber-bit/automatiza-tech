<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 80px; }
  .emoji { font-size: 96px; }
  h1 { font-weight: 800; font-size: 48px; color: var(--tinta); text-align: center; line-height: 1.2; }
  p { font-weight: 600; font-size: 26px; color: var(--tinta); opacity: 0.7; text-align: center; max-width: 740px; }
  .highlight { color: var(--fucsia); }
</style>
</head>
<body>
  <div class="emoji">🎉📸</div>
  <h1>En cada cumpleaños hay <span class="highlight">20 niños</span>…<br>y <span class="highlight">ninguna foto</span> de ellos.</h1>
  <p>El papá y la mamá están corriendo. Nadie saca la cámara. Y al otro día, lo único que queda es el recuerdo borroso del celular de un tío.</p>
</body>
</html>
