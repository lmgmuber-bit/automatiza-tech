<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body {
    padding: 40px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 48px;
    gap: 12px;
  }
  .header-logo {
    height: 130px;
    width: auto;
  }
  .header-title {
    font-weight: 800;
    font-size: 52px;
    color: var(--tinta);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 32px;
    width: 100%;
    max-width: 980px;
    flex: 1;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }

  .step-number {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--fucsia);
    color: white;
    font-weight: 800;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step-tablet {
    width: 340px;
    height: 453px;
    border-radius: 24px;
    border: 8px solid var(--tinta);
    box-shadow: 0 18px 48px rgba(76, 40, 130, 0.18);
    overflow: hidden;
    flex-shrink: 0;
  }
  .step-tablet img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .step-title {
    font-weight: 800;
    font-size: 28px;
    color: var(--tinta);
    line-height: 1.2;
  }
  .step-sub {
    font-weight: 500;
    font-size: 18px;
    color: var(--tinta);
    opacity: 0.75;
    max-width: 300px;
    line-height: 1.35;
  }

  .footer {
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 600;
    font-size: 18px;
    color: var(--tinta);
    opacity: 0.7;
  }
  .footer img {
    height: 28px;
    width: auto;
  }
</style>
</head>
<body>

  <div class="header">
    <img class="header-logo" src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/design/logo/cumpleclick-globo-lockup.svg"
         alt="CumpleClick">
    <h1 class="header-title">Así funciona CumpleClick</h1>
  </div>

  <div class="grid">

    <div class="step">
      <div class="step-number">1</div>
      <div class="step-tablet">
        <img src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/design/screens/screen-02-invitados.png"
             alt="Pantalla de invitados">
      </div>
      <div class="step-title">Elige quién eres</div>
      <div class="step-sub">Cada invitado toca su nombre en la pantalla</div>
    </div>

    <div class="step">
      <div class="step-number">2</div>
      <div class="step-tablet">
        <img src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/design/screens/screen-03-ruleta.png"
             alt="Pantalla de la ruleta">
      </div>
      <div class="step-title">La ruleta decide</div>
      <div class="step-sub">Un personaje de la temática sale a recibirlo</div>
    </div>

    <div class="step">
      <div class="step-number">3</div>
      <div class="step-tablet">
        <img src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/design/screens/screen-06-preview.png"
             alt="Pantalla de la foto">
      </div>
      <div class="step-title">¡Click!</div>
      <div class="step-sub">Se toma la foto junto a su personaje favorito</div>
    </div>

    <div class="step">
      <div class="step-number">4</div>
      <div class="step-tablet">
        <img src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/design/screens/screen-07-qr.png"
             alt="Pantalla del código QR">
      </div>
      <div class="step-title">Se la lleva</div>
      <div class="step-sub">Escanea el QR y la foto queda en su celular</div>
    </div>

  </div>

  <div class="footer">
    <img src="file:///C:/wamp64/www/automatiza-tech/CumpleBooth/public/brand/cumpleclick-mark.svg"
         alt="">
    <span>CumpleClick</span>
  </div>

</body>
</html>
