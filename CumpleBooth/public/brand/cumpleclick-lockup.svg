<svg viewBox="0 0 640 160" width="640" height="160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CumpleClick">
  <!-- Lockup horizontal OFICIAL "El globo dulce" (design/MANUAL-DE-MARCA.md). -->
  <defs>
    <radialGradient id="cch-body" cx="34%" cy="26%" r="88%">
      <stop offset="0%" stop-color="#B9A0F7"/>
      <stop offset="34%" stop-color="#8B5CF6"/>
      <stop offset="72%" stop-color="#C0409E"/>
      <stop offset="100%" stop-color="#D6307F"/>
    </radialGradient>
    <linearGradient id="cch-ring" x1="0" y1="0" x2="1" y2="1">
