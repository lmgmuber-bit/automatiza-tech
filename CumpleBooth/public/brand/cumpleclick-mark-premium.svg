<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CumpleClick premium">
  <defs>
    <radialGradient id="ccp-velvet" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#332552"/>
      <stop offset="100%" stop-color="#241B3A"/>
    </radialGradient>
    <linearGradient id="ccp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8D97C"/>
      <stop offset="45%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#E8A317"/>
    </linearGradient>
    <linearGradient id="ccp-gold-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#D99A14"/>
    </linearGradient>
    <radialGradient id="ccp-gem" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#F272AE"/>
      <stop offset="55%" stop-color="#D6307F"/>
      <stop offset="100%" stop-color="#9C1E5B"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="52" fill="url(#ccp-velvet)"/>
  <rect x="7" y="7" width="186" height="186" rx="49" fill="none" stroke="url(#ccp-gold)" stroke-width="1.6" opacity="0.85"/>

  <!-- Obturador/confeti en oro: 6 pétalos con filo iluminado -->
  <g transform="translate(100,100)">
    <g>
      <g fill="url(#ccp-gold)" stroke="url(#ccp-gold-edge)" stroke-width="1.2">
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5"/>
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5" transform="rotate(60)"/>
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5" transform="rotate(120)"/>
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5" transform="rotate(180)"/>
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5" transform="rotate(240)"/>
        <rect x="-12.5" y="-74" width="25" height="52" rx="12.5" transform="rotate(300)"/>
      </g>
      <!-- brillo especular sutil en el pétalo superior -->
      <rect x="-8" y="-70" width="7" height="40" rx="3.5" fill="#FFF6D8" opacity="0.5"/>
    </g>
    <!-- Aro de engaste + gema fucsia -->
    <circle r="27" fill="url(#ccp-gold)"/>
    <circle r="21" fill="url(#ccp-gem)"/>
    <ellipse cx="-6" cy="-8" rx="8" ry="5" fill="#FFD9EC" opacity="0.55"/>
  </g>

  <!-- Chispa de flash, dorada, más contenida -->
  <path d="M156 36 L160.5 47 L171.5 51.5 L160.5 56 L156 67 L151.5 56 L140.5 51.5 L151.5 47 Z" fill="url(#ccp-gold)"/>
</svg>
