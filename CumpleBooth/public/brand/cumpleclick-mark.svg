  <circle cx="78" cy="74" r="11" fill="#8B5CF6"/>
  <circle cx="46" cy="176" r="9" fill="#A78BFA"/>
  <circle cx="84" cy="292" r="10" fill="#FBBF24"/>
  <circle cx="352" cy="196" r="9" fill="#FBBF24"/>
  <circle cx="330" cy="300" r="10" fill="#D6307F"/>

