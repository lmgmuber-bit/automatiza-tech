  - event_date
  - event_time
  - address

invitation_contract:
  independent_from_party: true
  party_id_nullable: true
  image_states:
    - generic_theme_image
    - personalized_invitation_image
  video_states:
    - generic_theme_video_without_event_data
    - personalized_invitation_video_with_exact_event_data
  dynamic_overlay_contract:
    generic_image_and_video_keep_panel_blank: true
    application_renders_validated_event_data_over_generic_assets: true
    generated_personalized_outputs_bake_exact_event_data: true
  required_prompt_placeholders:
    - "[NOMBRE_DEL_CUMPLEAÑERO]"
    - "[FECHA_Y_HORA]"
    - "[DIRECCIÓN]"
  unresolved_placeholder_policy: reject
  delivery: opaque_revocable_download_link_only
  automatic_send_or_attachment: false

visual_lineage:
  canonical_master: approved_generic_invitation_image
  personalized_invitation_is_instance_not_master: true
  manifest_version: 1
  manifest_locks:
    - color_palette
    - character_bible_and_proportions
    - materials_and_3d_treatment
    - lighting_and_atmosphere
    - decorative_motifs
    - typography_and_contrast
  required_for_all_photobooth_assets: true
  drift_policy: reject_as_visual_drift
  master_update_policy: create_new_version_without_silent_party_migration

photobooth_reuse:
  action: new_party_from_theme
  creates_new_party_slug_and_kiosk_link: true
  reuses_theme_assets_and_layout: true
  resets:
    - guests
    - photos
    - gallery_enabled
    - gallery_pin
    - invitation_outputs
    - invitation_download_token

safety:
