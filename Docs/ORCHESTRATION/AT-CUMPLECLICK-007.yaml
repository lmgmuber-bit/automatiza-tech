acceptance:
  criteria:
    - "La invitación funciona independientemente del kiosco y puede asociarse opcionalmente a una fiesta."
    - "Existen una imagen genérica sin datos y una segunda imagen personalizada con nombre, fecha/hora y dirección exactos."
    - "Existen dos videos distinguibles: uno genérico con panel vacío para overlay dinámico de la aplicación y otro personalizado derivado de la imagen con los datos reales."
    - "El admin puede compilar/copiar el prompt, subir/aprobar outputs y compartir solo un enlace opaco y revocable de descarga."
    - "La invitación genérica aprobada es el máster visual obligatorio del Photo Booth; ningún asset temático se diseña de forma independiente."
    - "Todos los assets derivados declaran visual_version y respetan paleta, personajes, materiales, iluminación y decoración del manifiesto."
    - "Tema completo con banner, sala, grupo, seis personajes, recortes, música autorizada y fallbacks."
    - "Invitación, bienvenida y seis saludos en video aprobados; si saldo o gate bloquean una generación, el ticket permanece incompleto."
    - "Flujo intro a diploma completo, cámara física y foto alineada."
    - "Responsive aprobado en tablet física de 10 pulgadas."
    - "Carreras continúa funcionando sin regresiones."
    - "Galería desacoplada del PIN y disponible solo en plan full con activación administrativa explícita."
    - "Ningún término reservado aparece en prompts enviados a proveedores."
    - "Nueva fiesta desde la temática crea un slug/enlace propio sin copiar PIN, galería, invitados, fotos ni invitaciones."
  tests:
    - "PHP 8.2/8.3/8.4, migraciones, auth, CSRF, validaciones y rollback."
    - "Build, pruebas frontend, geometría, imagen/video fallback y consola."
    - "QA Chrome real y tablet 10 pulgadas de invitación a diploma."
  rollback_plan: "Desactivar tema e invitaciones por feature flag; volver a última plantilla aprobada y conservar Carreras sin cambios de contrato."

next_action: >
  Tema Familia Canina completado e integrado en local: seis personajes, recortes, puzzles,
  saludos, fondos, ruleta, invitación, photoSession, despedida, Full y atlas. No quedan cambios
  por guardar; deploy/merge requieren autorización de Luis.
