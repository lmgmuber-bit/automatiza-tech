  what: >
    Las 3 galerías demo bloqueaban §3.3 del handoff (gallery_enabled=true pero sin PIN real →
    404 igual; 2-4 invitados nada más). Corregido: demo/demo-tropical/demo-carreras tienen ahora
    10 invitados y PIN real 2026. Sigue pendiente sembrar 2-3 fotos por fiesta antes de capturar
    screen-10-galeria-* — instrucciones exactas en el handoff §3.2-3.3.
