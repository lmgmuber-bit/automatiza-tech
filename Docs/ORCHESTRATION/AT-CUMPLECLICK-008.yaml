objective: >
  Producir el paquete que explica QUÉ ES CumpleClick a un cliente potencial, usando pantallazos
  reales del kiosco y el logo real: infografías, carrusel de Instagram y un video explicativo de
  45-60s. Distinto de los reels ya publicados: los reels son hook de 10-14s, esto es el material
  de conversión para quien ya se interesó y pregunta cómo funciona.

context_required_before_starting:
  vault_project_note: "10-Projects/CumpleClick.md"
  handoff: "CumpleBooth/docs/OPENCODE-HANDOFF-EXPLICATIVO-CUMPLECLICK.md"
  brand_source_of_truth: "CumpleBooth/design/MANUAL-DE-MARCA.md"
  graph: "graphify-out/graph.json"
  note: >
    El handoff es autosuficiente para la tarea, pero la nota del vault es obligatoria para
    entender el producto y sus reglas duras (camuflaje, prompts en BD, créditos, privacidad).

ownership:
  planner: claude
  executor: opencode
  reviewer: claude
  final_approver: "Luis Miguel"
  current_owner: opencode
  takeover_allowed: true
  urgency: normal

routing:
  complexity: C1
  risk: low
  uncertainty: low
  reversibility: high
  selected_profile: standard_executor
  rationale: >
    Trabajo de marketing contenido en design/. No toca el producto, la BD ni el deploy.
    El riesgo real es de marca (logo mal usado, precio equivocado, prompt de generación con
    nombre de franquicia sin querer) no técnico. Por eso los gates son de contenido, no de código.

