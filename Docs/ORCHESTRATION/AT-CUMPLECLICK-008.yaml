optional_ai_generation:
  authorized: pending_luis
  provider: higgsfield
  model: nano_banana_pro
  unit_cost_credits: 2
  scope: "6 imágenes de apoyo (§7 del handoff) + prueba de infografía A/B/C (§9)"
  max_credits: 20
  stop_and_ask_above_credits: 20
  cost_preflight_required: true
  music_generation_forbidden: true
  note: >
    Si OpenCode no tiene acceso a Higgsfield, entrega igual A-G (que son 0 créditos) y deja la
    generación IA para Claude o Luis. El acceso NO bloquea el ticket.

human_gates:
  - after: B
    reason: "Luis aprueba el estilo visual antes de replicarlo en 8 piezas más."
  - after: "prueba §9"
    reason: "Luis elige entre infografía por IA, híbrida o HTML puro."
  - before: "cualquier gasto de créditos"
    reason: "Autorización explícita de Luis, como en 006/007."

scope:
  allowed_files:
    - "CumpleBooth/design/**"
    - "CumpleBooth/scripts/capture-screens.mjs"
    - "CumpleBooth/docs/OPENCODE-HANDOFF-EXPLICATIVO-CUMPLECLICK.md"
    - "Docs/ORCHESTRATION/AT-CUMPLECLICK-008.yaml"
  temporarily_modifiable_must_restore:
    - "CumpleBooth/public/data/parties.json"
    - "CumpleBooth/dist/data/parties.json"
  forbidden_files:
    - "CumpleBooth/src/**"
    - "CumpleBooth/public/**"
    - "CumpleBooth/dist/**"
    - "wp-content/**"
    - "tablero/**"
    - "api-tablero.php"
  allowed_new_dependencies:
    - "puppeteer-core (devDependency, usa el Chrome ya instalado)"

safety:
  allow_external_generation: false
  allow_external_generation_after_human_gate: true
  allow_push: false
  allow_merge: false
  allow_deploy: false
  allow_secrets: false
  no_global_installs: true

brand_constraints:
  logo_must_be_composited_from_svg: true
  logo_must_never_be_ai_generated: true
  # CORREGIDO 2026-07-25 por Luis: el nombre genérico/camuflado es SOLO para los
  # prompts de generación (Higgsfield/Gemini, para no chocar con el filtro).
  # El producto y el marketing público SÍ usan el nombre real de la franquicia
  # (Bluey, Stitch) — es lo que el papá busca y el niño reconoce.
  franchise_names_forbidden_in_public_pieces: false
  franchise_names_forbidden_in_generation_prompts: true
  real_children_faces_forbidden: true
  required_font: "Baloo 2 (node_modules/@fontsource/baloo-2)"
  palette_proportion: "70% crema / 20% violeta-fucsia / 8% amarillo / 2% oro"
  technical_jargon_forbidden_in_copy: ["IA", "software", "app", "sistema"]

open_questions_for_luis:
  - "¿Qué diferencia exactamente el plan Premium del Mágico? (la tabla de la pieza D es
     reconstrucción de Claude y puede estar incompleta)"
  - "¿El CTA al pie va a WhatsApp o a automatizatech.cl?"
  - "¿La versión 16:9 lleva música? (si sí, la genera Luis, no se gastan créditos)"

acceptance:
  criteria:
    - "Los 14 pantallazos son del kiosco real corriendo; ninguno es un mockup dibujado."
    - "Toda pieza usa la Baloo 2 real; ninguna cayó en Arial o system-ui."
    - "El logo aparece compuesto desde el SVG, nunca redibujado ni generado."
    - "El nombre real de la franquicia puede aparecer en piezas públicas; solo los prompts de
       generación (§7/§9) usan descripción camuflada. Ninguna pieza muestra cara de niño real."
    - "Los dos videos son h264/yuv420p/faststart y se ven completos sin texto cortado."
    - "parties.json quedó restaurado y check-dist-parity.php sale en verde."
    - "design/explicativo/README.md documenta cada archivo y cómo regenerarlo."
    - "Las piezas con datos sin confirmar están marcadas como borrador."
  tests:
    - "ffprobe de F y G pegado literal en el reporte."
    - "php scripts/check-dist-parity.php exit 0."
    - "Revisión visual pieza por pieza antes de entregar."
  rollback_plan: >
    Todo el entregable vive en CumpleBooth/design/. Borrar la carpeta explicativo/ y screens/
    revierte el ticket completo sin tocar el producto.

