execution_log:
  - date: "2026-08-01"
    by: codex
    what: >
      Luis reasignó a Codex la corrección del frontend público, dejando la conexión real de
      WhatsApp para el último gate. Se corrigió overflow en 375/390/768/1440 px, semántica del
      H1, accesibilidad completa del modal, foco visible de FAQ, coherencia de galería por plan,
      cuota de 200 fotos, temática a medida +$25.000, comuna y consentimiento en el formulario,
      bloque de privacidad/cobertura/condiciones y la deprecación THREE.Clock. Los descuentos de
      lanzamiento del 50% se conservaron por aprobación explícita de Luis. QA Chrome local sin
      errores; WhatsApp sigue deliberadamente con [WHATSAPP_NUMBER]. Sin deploy/commit/push/merge.
  - date: "2026-07-27"
    by: opencode
    what: >
      Entregable A construido en CumpleBooth/sitio/: hero, cómo funciona, vitrina de 6 mundos,
      precios, CTA final + footer. 3D globo-lente diferido (import() + idle) con fallback
      estático y auto-degradado bajo 30fps. Lenis + GSAP solo transform/opacity. 0 créditos
      Higgsfield/BudgetPixel gastados. QA puppeteer verde: 375px (hero+CTA ~1.2s, CTA sobre el
      fold), reduced-motion sin Lenis/3D, sin WebGL con fallback, desktop 60fps, 0 errores
      consola. Detenido en human gate: Luis revisa en
      http://localhost/automatiza-tech/CumpleBooth/sitio/ antes de entregable B
      (diferenciadores + FAQ). [WHATSAPP_NUMBER] placeholder pendiente de número real.
  - date: "2026-07-27 (tarde)"
    by: opencode
    what: >
      Entregable B construido: diferenciadores, invitaciones digitales (servicio actual),
      FAQ con teaser fase 2, y sección "Míralo en acción" con video Frozen opt-in
      (usa video-frozen-juegos-web.mp4, la versión web que Claude generó en AT-009).
      Carrera real OpenCode/Claude sobre sitio/js y sitio/css resuelta por fusión:
      implementaciones Claude conservadas, duplicados OpenCode eliminados. Más efectos
      3D de transición (pedido Luis): data-depth rotationX, parallax de salida del hero,
      tilt en vitrina, carrusel auto móvil que cede al toque. QA final verde: secciones
      visibles, modal funcional, reduced-motion limpio, 0 errores. Sigue human gate:
      revisión de Luis + número WhatsApp + decisión URL.

objective: >
  Construir la landing pública de CumpleClick: la página que ve un padre o madre que TODAVÍA NO
  contrató, decidiendo si reserva. Hoy no existe — el handoff se escribió el 2026-07-21 y nunca se
  ejecutó, así que no hay dónde mandar a un prospecto salvo WhatsApp directo. Es la pieza que
  convierte, por eso va antes que las mejoras del kiosco (AT-CUMPLECLICK-010).

priority_rationale: >
  P1 sobre el kiosco: el kiosco mejora la experiencia de quien YA contrató; la landing es lo que
  trae clientes nuevos. Con producción recién desplegada y 4 demos por temática listas para
  mostrar, no tener sitio es el cuello de botella comercial.

context_required_before_starting:
  vault_project_note: "10-Projects/CumpleClick.md"
  handoff: "CumpleBooth/docs/OPENCODE-HANDOFF-SITIO-CLIENTES.md"
  brand_source_of_truth: "CumpleBooth/design/MANUAL-DE-MARCA.md + design/tokens.css"
  mandatory_skills:
    - "design-taste-frontend (Design Read obligatorio en el reporte)"
    - "frontend-motion-toolkit (Motion read obligatorio en el reporte)"

ownership:
  planner: claude
  executor: opencode
  reviewer: claude
  final_approver: "Luis Miguel"
  current_owner: codex
  takeover_allowed: true
  urgency: normal

routing:
  complexity: C1
  risk: low
  uncertainty: low
  reversibility: high
  selected_profile: standard_executor
  rationale: >
    Entregable nuevo y aislado en su propia carpeta. No toca el kiosco, el admin, la BD ni el
    deploy. El riesgo es de marca y de conversión (copy genérico, precios mal escritos, CTA que no
    funciona), no técnico.

decisions_2026_07_27:
  - who: "Luis Miguel"
    what: "Autorizadas GSAP y Lenis para el sitio."
    context: >
      El handoff original (2026-07-21) prohibía toda librería de motion y exigía CSS puro +
      IntersectionObserver. Luis pidió permitir animación más ambiciosa. El handoff §3 y §5 ya
      quedaron actualizados; la versión anterior no aplica.
  - who: "Luis Miguel"
    what: "El sitio va antes que las animaciones del kiosco (AT-CUMPLECLICK-010)."
  - who: "Luis Miguel"
    what: "3D autorizado en el sitio (Three.js, ya instalada) con transiciones."
    context: >
      Revierte la prohibición de three que Claude había puesto por peso. Condiciones en el handoff
      §3.1: carga diferida con import(), fallback estático sin WebGL o con reduced-motion, el hero
      y el CTA visibles aunque el 3D falle, y medición de fps en móvil en el reporte.
  - who: "Luis Miguel"
    what: "Higgsfield autorizado si hace falta — pero el saldo es de 11.17 cr (2026-07-27)."
    context: >
      Alcanza para ~5 imágenes O 1 video. Regla en el handoff §5.1: preflight get_cost obligatorio,
      autorización de Luis por cada generación, tope de 6 cr antes de parar y preguntar, nunca
      música, nunca el logo. Recomendación: construir con los assets existentes y no generar nada.

deliverables:
