    name: "Landing de una página: hero, cómo funciona, temáticas, precios, CTA final"
    path: "CumpleBooth/sitio/ (carpeta nueva)"
    credits: 0
    blocking: true
    human_gate: true
  - id: B
    name: "Secciones opcionales: diferenciadores y FAQ"
    blocking: false

human_gates:
