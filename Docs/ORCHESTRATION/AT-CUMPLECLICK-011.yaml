    La URL final del sitio (si reemplaza la raíz de automatizatech.cl/cumpleclick/ y el kiosco pasa
    a un subpath, o si vive en otra ruta) la decide Luis. OpenCode entrega funcionando en local.

brand_constraints:
  tokens_source: "design/tokens.css — no reinventar colores a mano"
  required_font: "Baloo 2 (self-hosted vía @fontsource/baloo-2, nunca por CDN)"
  palette_proportion: "70% crema / 20% violeta-fucsia / 8% amarillo / 2% oro"
  logo_from_svg_only: true
  precios_oficiales: "Mágico $69.990 · Premium $99.990 · Temática a medida +$25.000"
  cta_unico: "Agenda la fecha por WhatsApp — número real lo confirma Luis, usar placeholder visible mientras tanto, NUNCA inventar un número"
  technical_jargon_forbidden: ["IA", "software", "app", "sistema"]
  real_children_faces_forbidden: true

hard_constraints:
  mobile_first: "Probar en 375px ANTES que en desktop: ahí decide el cliente"
  no_scroll_hijacking: "Lenis suaviza, no secuestra. Rueda, teclado y barra siguen funcionando"
  reduced_motion: "prefers-reduced-motion: reduce desactiva Lenis y parallax"
  animatable_properties_only: ["transform", "opacity"]
  cta_never_blocked: "Ninguna animación puede tapar, mover ni retrasar el CTA de WhatsApp"
  no_cdn: "Todo self-hosted, igual que el resto del proyecto"
  no_new_ai_assets: "Reusar los assets ya generados; no gastar créditos Higgsfield/BudgetPixel"

acceptance:
  criteria:
    - "El sitio corre en local y se ve completo en 375px y en desktop."
    - "Usa tokens.css y Baloo 2 real; ninguna sección cayó en colores o tipografía inventados."
    - "Precios y CTA exactos según brand_constraints; ningún número de WhatsApp inventado."
    - "Design Read y Motion read declarados en el reporte."
    - "Lenis no rompe el scroll nativo; probado con prefers-reduced-motion."
    - "Medición de cuánto tarda en verse hero y CTA en móvil, pegada en el reporte."
    - "El 3D carga diferido y la página funciona completa sin él (sin WebGL o con reduced-motion)."
    - "Medición de fps del 3D en móvil pegada en el reporte; bajo 30fps se simplifica o se saca."
    - "Si se gastaron créditos: costo por generación y saldo final reportados."
  rollback_plan: >
    Todo vive en CumpleBooth/sitio/. Borrar esa carpeta revierte el ticket completo sin tocar el
    kiosco, el admin ni producción.

next_action: >
  No queda implementación local sin guardar. Luis debe confirmar número oficial de WhatsApp,
  URL final y autorización de deploy; esos datos no se inventan. Rama versionada:
  codex/cumpleclick-site-frontend-fixes. Ver handoff canónico 2026-08-02.
