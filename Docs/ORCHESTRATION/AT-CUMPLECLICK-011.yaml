    - "CumpleBooth/public/brand/**"
    - "CumpleBooth/design/video/reels/**"
  forbidden_files:
    - "CumpleBooth/src/**"
    - "CumpleBooth/dist/**"
    - "CumpleBooth/public/admin/**"
