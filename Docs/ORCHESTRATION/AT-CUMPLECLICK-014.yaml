      (404 limpio, sin `immutable`). `api.php`, `upload.php`, `ver.php` y `lib.php` de PROD no se
      tocaron (md5 iguales a dist / lib.php del 26-ago con las 11 funciones cb_* necesarias).
      Verificado desde afuera: prueba de humo de sala.php 36/36 contra PROD, juego con WebGPU en
      temáticas Hielo (fiesta demo-frozen-vip cargada, QR con URL pública, sala creada y cerrada)
