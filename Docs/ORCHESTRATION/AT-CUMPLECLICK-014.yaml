execution_log:
  - date: "2026-09-06"
    by: claude
    what: >
      Hallazgo: los sitios alojados en Higgsfield responden 401 "unauthenticated" a cualquier
      visitante sin sesión de Higgsfield (verificado con curl y navegador limpio en los tres
      juegos del proyecto), y publish_website solo lista en el feed comunitario (prohibido por
      Luis). Por eso la sala multijugador de la plantilla (Durable Object, src/room.ts +
      src/logic.js) queda intacta sin usarse, y la fase 3 construyó un backend propio: PHP en
      CumpleBooth (public/sala.php + public/lib.sala.php, migración 014_salas_ayudantes,
      tablas cc_salas/cc_sala_ayudantes/cc_sala_acciones) con polling HTTP JSON (700 ms
      acciones, 2 s resumen); contrato documentado en tucumple-repo/app/design/sala-api.md.
      Del lado del juego: generador de QR propio (game/qr.js), cliente HTTP (game/sala.js),
      orquestador que crea la sala y aplica acciones (game/ayudantes.js) y la página del
      celular (ayudante.html/.js). Tokens hasheados, IP solo como HMAC, enfriamientos por
      ayudante y tipo, cupo 12 por sala, tope 60 acciones/min, sala vive 6 horas. Verificado:
      prueba de humo HTTP del contrato completo (36 checks OK), 6 QR decodificados con OpenCV
      (v1, v3, v5, v7, v10 x2), partida en navegador con celular simulado (3 acciones
      recibidas y aplicadas, heroe.ayuda true, revelado activo, 58 fps, 54 draw calls). 0
      créditos de Higgsfield gastados (saldo sigue en 99,73). Documentación sincronizada:
      tucumple-repo/app/README.md (estado + sección Fase 3), CumpleBooth/README.md (fuentes
      de verdad). Nada desplegado a PROD; sin commit ni push de este ticket.
  - date: "2026-09-06"
    by: claude
    what: >
      DESPLEGADO A PROD por Claude vía SSH/SFTP (paramiko), autorizado por Luis ("tú puedes
      subir a PROD, por SSH lo hiciste en el pasado"). Deploy aditivo a
      https://automatizatech.cl/cumpleclick/: `sala.php` + `lib.sala.php` (nuevos), migración
      014 aplicada con runner puntual en `private-cumpleclick/database/` (tablas cc_salas,
      cc_sala_ayudantes, cc_sala_acciones; PROD tenía 001–009, 010–013 siguen sin desplegar),
