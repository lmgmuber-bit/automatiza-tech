execution_log:
  - date: "2026-09-06"
    by: claude
    what: >
      Lado CumpleClick: `cb_sala_fotos()` en `public/lib.sala.php` valida sala + anfitrión, slug
      de fiesta y PIN de la galería (`cb_verify_party_pin`) antes de devolver hasta 12 fotos
      recientes como rutas `ver.php?t=…&download=inline` (nunca tokens sueltos ni storage_key);
      nueva op `fotos` en `public/sala.php` con su propio límite (5/min, bloqueo 5 min).
      `cb_sala_ips_lan()` añade `hosts` (IPv4 privadas del servidor) a la salida de `crear`, para
      que el QR de la fase 3 sea alcanzable aunque la tablet abra el juego en `localhost`.
      `tests/backend/salas.php` subió de 61 a 73 checks. `upload.php` y `api.php` no se
      tocaron. Lado del juego (`tucumple-repo`, commit `0ec25f7`): `game/fiesta.js` lee
      `api.php?p=<slug>` (nombre, invitados, frameBox, temática) con base configurable por
      `?cc=` y recordada en `localStorage`; `game/foto.js` agrega un botón de foto manual y
      fotos automáticas (45 % de cada cinemática, 2,6 s en la fiesta final) que, con fiesta,
      componen un recuerdo 1080×1920 igual que el kiosco y lo suben a `upload.php`;
      `game/galeria.js` cuelga las fotos del kiosco y las del propio juego en un cartel de la
      plaza y en cuadros del salón del castillo, y pone los nombres de los invitados sobre los
      globos. Verificado con Playwright (WebGPU, 41–48 fps): fiesta de prueba `prueba-3d`
      cargada (Isidora, tema Reino de Hielo, 5 invitados), PIN de galería aceptado, foto manual
      PNG 1080×1920 de 2,9 MB subida y visible en la galería, listado con PIN devuelve la foto,
      cuadros del salón y cartel de la plaza la muestran, 5 nombres sobre los globos, foto
      automática de una cinemática subida sola, 0 errores de consola. Créditos de Higgsfield
      gastados: 0. Documentación sincronizada: `tucumple-repo/app/README.md` (estado + sección
      Fase 4), `tucumple-repo/app/design/sala-api.md` (op `fotos`, campo `hosts`, contrato de
      `upload.php`/`api.php?p=`), `CumpleBooth/README.md` (línea de `sala.php`/`lib.sala.php`).
      Nada desplegado a PROD; sin commit ni push de este ticket.
  - date: "2026-09-06"
    by: claude
    what: >
      DESPLEGADO A PROD por Claude vía SSH/SFTP (paramiko), autorizado por Luis ("tú puedes
      subir a PROD, por SSH lo hiciste en el pasado"). Deploy aditivo a
