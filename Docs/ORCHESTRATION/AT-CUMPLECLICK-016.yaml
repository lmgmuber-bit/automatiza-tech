execution_log:
  - date: "2026-09-06"
    by: claude
    what: >
      Motor convertido a multi-temática: `game/temas/index.js` resuelve la temática por
      `?tema=`, por el slug de la fiesta de CumpleClick (`?p=`), por la ruta/host del juego, o
      Hielo por defecto; `aplicarTema()` reemplaza los textos de `T` en el lugar y ajusta CSS,
      título, `<h1>`, rótulos de botones táctiles, icono del contador y "Controles". Cada
      temática (`game/temas/hielo.js`, `game/temas/heroes.js`) define clave de guardado propia,
      ruta de assets, heroína, guía, 7 invitados de la fiesta, criaturas, música, voces, portada,
      slugs del kiosco, CSS y el módulo de mundo cargado con `import()` dinámico. `save.js`,
      `voz.js`, `audio.js`, `ui.js`, `main.js`, `mundo.js` y `misiones.js` se hicieron
      configurables para soportar esto. Temática Héroes creada: textos en
      `game/temas/heroes-strings.js` (mismas claves que `strings.js`); ids internos de misión
      sin cambios (`criaturas`=mascotas Bigotes/Chispa/Copito, `cascada`=Octo-bot,
      `tormenta`=puente de 3 tramos, `castillo`=torre Web-Quarters, `copos`=emblemas); 32 de 43
      líneas de voz calzan letra por letra con el juego v1, 2 pasos de tutorial reescritos sin
      voz. Mundo nuevo `game/mundo-ciudad.js` (misma API pública que `mundo.js`): ciudad de
      noche con plaza, TRACE-E, 21 manzanas de edificios con texturas procedurales, parque con
      3 mascotas, canal con puente roto, tejado con el Octo-bot patrullando, torre Web-Quarters
      con azotea de fiesta, 6 puntos seguros, 20 emblemas, skyline de 46 rascacielos, 3
      cinemáticas propias. Assets reutilizados del juego v1 con nombres neutros en
      `public/temas/heroes/` (8,4 MB: 8 modelos GLB, música, 43 voces, portada), 0 créditos de
      Higgsfield gastados. Corregido además un gancho de pruebas preexistente:
      `window.__juego.forzar()` entregaba "pressed" después del paso de física con fps exactos
      de 60 y se perdía; ahora se entrega justo antes de ese paso. Verificado con Playwright
      (WebGPU): partida completa en Héroes — 3 mascotas, puente 3/3 con cinemática, Octo-bot
      atrapado con cinemática, torre abierta, azotea con fiesta y 7 invitados, fotos automáticas
      en cada momento clave, 0 errores de consola, 230 draw calls en la plaza, 55 fps en calidad
      "baja" vía Playwright (Playwright renderiza WebGPU headless a 20–55 fps, por debajo de lo
      medido a mano, y las cinemáticas duran más en tiempo de reloj). Escáner de propiedad
      intelectual de Higgsfield: pasó, deploy aceptado. Desplegado a sitio Higgsfield nuevo
      `aventura-aracnida-2` (website_id `dfc26b1f-2c35-4115-9937-1046097723ee`,
      `https://aventura-aracnida-2.higgsfield.app`), mismo repo con remoto `aracnida2`, temática
      detectada por el host. Espejos locales creados/actualizados:
      `C:\wamp64\www\juego-spidey-v2\` (temática por ruta) y
      `C:\wamp64\www\tucumple\` (`?tema=heroes` para forzarla). El sitio y la carpeta de la v1
      (`juego-spidey`, `heroe-aracnido-cumple.higgsfield.app`) no se tocaron; CumpleBooth no
      cambió en este ticket. Documentación sincronizada: `tucumple-repo/app/README.md` (estado
      multi-temática, sección "Temáticas", sección "Temática Héroes — Aventura Arácnida v2",
      parámetro `?tema=`, archivos nuevos, gotchas de fps/gancho de pruebas/Playwright/guardado
      por temática/draw calls, "Próximas fases"), `tucumple-repo/app/design/assets.csv` (filas
      de assets Héroes reutilizados, origen "juego v1 / copiados sin costo", 0 cr),
      `tucumple/CONTEXTO-CODEX.md` (§1 nota de motor multi-temática y sitio nuevo, §2 tabla de
      archivos con `game/temas/*`, `game/mundo-ciudad.js`, `temas/heroes/`). Sin commit ni push
      de este ticket en el repo automatiza-tech (solo se tocó `tucumple/CONTEXTO-CODEX.md`, que
      no vive en este repo).
