objective: >
  Que el kiosco de CumpleClick funcione en ferias: un selector (app/feria.html?f=<slug>) con pantalla de espera en
  bucle, elección Niños / Adultos, grilla de mundos habilitados y autorización del adulto responsable; y un recorrido
  de feria en el kiosco (sin lista de invitados, nombre opcional, diploma "en {feria} · {fecha}" para niños, adultos sin
  diploma y sin ruleta cuando la temática no tiene personajes, franja de recuerdo con el número F-### en la foto y vuelta
  automática al selector). Una fiesta sin feria no cambia en nada.
