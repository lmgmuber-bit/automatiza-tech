acceptance:
  criteria:
    - "feria.html?f=<slug>: espera con video en bucle -> Niños/Adultos -> mundo -> autorización (solo niños) -> kiosco con tema, modo y volver; vuelve a espera tras 45 s sin toques."
    - "Con feria: '¿Cómo te llamas?' en vez de la lista de invitados (opcional, máx. 20 caracteres)."
    - "Niños: diploma 'en {feria.nombre} · {fecha_texto}'. Adultos: sin diploma y sin textos infantiles."
    - "Temática sin personajes (personajes vacío en themes.json): sin ruleta, directo a la foto en el marco."
    - "Franja de recuerdo (feria.recuerdo + organizador_ig + F-###) en la foto y en el diploma de niños, sin tapar la cara; número reservado con POST feria-api.php y enviado a upload.php como feria_reserva."
    - "Pantalla del QR con 'Tu foto: F-###'; vuelta automática al selector a los 60 s."
    - "Una fiesta sin feria se ve y funciona exactamente igual (prueba de regresión)."
    - "Español de Chile, botones de 44 px o más, prefers-reduced-motion respetado, sin nombres de franquicias en textos nuevos."
  tests:
    - "npm test (incluye tests/frontend/feria*.test.mjs nuevos)"
    - "npm run build limpio"
    - "Capturas a 1200 x 2000 (vertical, Galaxy Tab A7) del selector y del recorrido niños y adultos"

