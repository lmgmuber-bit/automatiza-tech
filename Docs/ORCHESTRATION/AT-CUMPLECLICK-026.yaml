acceptance:
  criteria:
    - "Una fiesta adult_birthday con la temática adulta abre el kiosco sin ruleta ni personajes (cumple-adulto-http.php)."
    - "El admin rechaza con aviso temática adulta en fiesta infantil y viceversa; api.php responde 409 ante el cruce en la base."
    - "La edad de un adulto se guarda entera (control en rojo: con el tope viejo de 17 la prueba falla)."
    - "Una fiesta infantil no recibe edad ni cabinaAdulto y conserva personajes y música."
    - "Recorrido local completo: bienvenida, juego de atrapar, frase, foto en el marco, QR (e2e con cámara falsa, sin errores de página)."
    - "Ningún dato del evento piloto en archivos versionados (barrido del diff antes de cada commit)."
    - "Suite frontend completa y suites backend en verde; build de Vite sin errores."
    - "Portada en pareja: titular elegido o ninguno, foto 4:5 sin texto sobre caras, QR (e2e)."
    - "Juegos del animador: nivel como techo, mazo sin repetir (también al volver a un juego), «Paso esta» sin castigo, un punto por equipo y ronda, Tribunal solo con preparación confirmada, mímica privada (tests del motor + recorrido en navegador)."
    - "Asómate adulto: 14 figuras cuyo hueco cubre ojos y boca ilustrados sin abrirse fuera del rostro (revisión visual con fondo de control); zoom siempre positivo."
    - "Invitación adulta silenciosa (sin narraciones de Alice, ni la de inicio), video con póster que no se interrumpe por el avance automático, asistencia sin vocabulario infantil."
    - "Rollback documentado con TODOS los PHP que se reemplazan y su orden, sin perder la modalidad ni la edad de las fiestas adultas y sin dejar su invitación publicada con el código anterior (ensayo con el código de 188ba45)."
    - "Revisión B por cargos del homólogo Codex (Forja, Lienzo, Centinela, Vigía, Contralor) sobre la misma revisión, con segundo ciclo tras las correcciones."
  pending_physical:
    - "Tablet real con cámara y personas reales (grupos, alturas, gafas)."
    - "Impresión si se usa (Selphy): medidas reales; los carteles de 33x48 cm no son plantilla del kiosco."

