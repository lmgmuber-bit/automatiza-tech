  no_subir: "Ninguno. El arne de QA se creo en C:\\wamp64\\www\\at-qa\\, fuera del repo, y ya fue eliminado."

result:
  summary: >
    Cambios aplicados y verificados en local, SIN commit. Quedan en el working tree de
    la rama fix/form-agenda-calendario-whatsapp esperando el visto bueno de Luis.
  evidence_refs:
    - "Contraste modal tras las correcciones: 0 fallos en tema oscuro y 0 en tema claro."
    - "Etiquetas de campo en claro: 4.05 -> 4.85. Mensaje de error: 1.73 -> 5.75. Enlace legal: 1.86 -> 5.02."
    - "Panel de exito: 440px centrado dentro del modal de 760px."
    - "Layout desktop 1280x800: modal 760x560, columnas 350/350, scrollY=0, overflowX=0."
    - "Layout tablet 768: columnas 326.5/326.5, scrollY=0, overflowX=0."
    - "Layout mobile 375: 1 columna de 289px, overflowX=0 en form, modal y body; 9 horarios."
    - "Landing portal-omnicliente reverificada tras el cambio de layout: identico al home."
    - "Fecha pasada: mensaje 'Solo puedes agendar desde hoy en adelante' + rangeUnderflow=true (submit bloqueado)."
    - "Fuera de ventana: mensaje 'Solo agendamos hasta 90 dias hacia adelante' + rangeOverflow=true."
    - "Fecha valida: 9 horarios renderizados, checkValidity()=true."
    - "Payload real a n8n: phone '+56912345678' desde '9 1234 5678' con prefijo +56."
    - "buildPhone: +54/'11 2345-6789' -> +541123456789; +593/'98 765 4321' -> +593987654321; +56/'+56 9 1234 5678' -> +56912345678 (no duplica); +1/'(305) 555-0134' -> +13055550134; vacio -> ''."
    - "color-scheme: dark en tema oscuro y light tras el toggle, en .at-date y .at-cc."
    - "Layout 1280px: select 142 + numero 249, overflow 0. Layout 375px: select 116 + numero 166, overflow 0."
    - "Spot-check en landing-asistentes-ia: mismo comportamiento (min/max, 10 prefijos, 9 horarios)."
    - "Sin errores de consola."
  residual_risks:
    - >
      HALLAZGO FUERA DE ALCANCE: auditada la home completa en tema claro, existen ~22 grupos
      de contraste bajo ANTERIORES a este ticket y fuera del modal: el turquesa de marca
      #2dd4bf sobre fondos claros (nav "Tech" 1.53, "GRATIS" 1.44, titular de 54px 1.63),
      texto blanco sobre fondos claros en la seccion del problema (1.25), el verde WhatsApp
      #25d366 (1.53) y varios badges #34d399 (1.82-1.92). No se tocaron: son decisiones de
      marca que afectan secciones enteras del sitio y merecen rama y criterio propios.
    - >
      at-home.js, at-home.css y body.html YA tenian cambios sin commitear antes de esta
      tarea (preseleccion de modo del modal, foco a11y, privacy_accepted/marketing_optin,
      secciones Planes y Quienes somos). Comitear o subir por FTP esos archivos arrastra
      tambien ese trabajo previo. Los hunks de este ticket son ~30 lineas en at-home.js,
      ~25 en body.html y ~11 en at-home.css.
    - >
      Las 7 carpetas assets/landing-*/ estan SIN TRACKEAR en Git (nunca se commitearon).
      Un commit de este ticket que las incluya seria su primer commit, con todo su contenido.
    - >
      showPicker() abre el calendario en cada clic sobre el campo. Es lo pedido, pero
      cambia el habito de tipear la fecha por segmentos. Se puede acotar a "solo cuando
      el campo esta vacio" si Luis lo prefiere.
  next_action: >
    Luis decide si se comitea todo junto en esta rama o si se separan solo los hunks del
    formulario. Sin merge ni deploy sin su autorizacion.
