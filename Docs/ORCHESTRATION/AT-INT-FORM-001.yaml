diagnostico:
  whatsapp: >
    El campo era un input suelto (placeholder "+56 9 1234 5678"), sin select de prefijo.
    El telefono viajaba a n8n tal cual lo escribiera el usuario, sin normalizar.
  fecha: >
    at-agenda.js si aplicaba min = hoy, pero el input type=date quedaba con
    color-scheme normal sobre fondo oscuro: el icono del picker y el popup nativo
    salian claros sobre el modal oscuro (el formulario viejo de footer.php si traia
    color-scheme:dark). Ademas no habia max, ni validacion en el submit, ni rechazo
    de fechas pasadas escritas a mano.

cambios_ronda_3_visual:
  pedido: "Luis: antes de commitear, revisar que otro tema visual se puede corregir."
  metodo: >
    Auditoria de contraste WCAG AA en navegador sobre el modal, en tema oscuro y claro,
    componiendo el alfa contra el fondo opaco real. Se desactivaron todas las transiciones
    CSS durante la medicion.
  falsos_positivos_descartados:
    - >
      "Demo en vivo" marcaba 2.17. Artefacto: el pane del navegador estaba oculto y no
      generaba frames, asi que las transiciones CSS quedaban congeladas en su color inicial
      (el del tema anterior). Con las transiciones desactivadas el fallo desaparece.
    - >
      Boton cerrar (X) marcaba 2.49. Artefacto de la funcion de contraste, que no componia
      el canal alfa y comparaba el icono contra blanco en vez del fondo real del boton.
  corregido:
    - >
      Panel de exito: regresion de la ronda 2. Con el modal a 760px el bloque
      "Solicitud recibida" quedaba con el parrafo capado a 320px flotando en 758px de ancho.
      Ahora max-width 440px centrado.
    - >
      Mensaje de error/exito ilegible en tema claro: setFormMessage tenia los colores
      hardcodeados con pasteles del modo oscuro. Rosa #f7b4b4 sobre blanco daba 1.73, o sea
      el mensaje que explica el fallo de envio era practicamente invisible. Los colores se
      movieron a at-home.css por tema; en claro el error queda en 5.75 (#b91c1c).
    - >
      Enlace "Politica de Privacidad" a 1.86 en tema claro: usaba #2dd4bf hardcodeado, sin
      seguir el tema. Pasa a var(--accent-text), token que ya existia en la paleta: 5.02 en
      claro y sigue turquesa en oscuro. Es el enlace legal obligatorio del formulario.
    - >
      Token global --text-faint del tema claro: #6f8094 daba 4.05 sobre blanco (minimo 4.5).
      Pasa a #647385 (4.85 sobre blanco, 4.55 sobre --surface-2). Autorizado por Luis tras
      presentarle el alcance: 141 usos en los 8 body.html.
  resultado: "Modal con 0 fallos de contraste en tema oscuro y claro (antes: 0 en oscuro, 9 en claro)."

cambios_ronda_2_layout:
  pedido: "Luis: formulario mas ancho aprovechando el modal, no tan largo, responsivo en web y mobile."
  problema: "Con el modal de 460px el formulario era una sola columna de 11 filas y obligaba a scrollear dentro del modal."
  aplicado:
    - "body.html x8: el modal pasa de width:min(460px,100%) a min(760px,100%)."
    - "body.html x8: el form deja el flex-column inline y toma class=at-form (grilla); toggle, boton y leyenda marcados con at-f-full."
    - "at-home.css: .at-form en grilla de 2 columnas con gap 12px/14px, una sola columna bajo 700px, y el mensaje de error de setFormMessage ocupando el ancho completo."
  detalle_tecnico: >
    Las columnas usan minmax(0,1fr) y no 1fr. Con 1fr el min-content del select de
    intereses (opcion mas larga: "Asistente inteligente / chatbot") ensanchaba su track:
    en desktop dejaba las columnas desparejas (300 vs 353) y en mobile forzaba el track a
    324px dentro de un contenedor de 289px, provocando scroll horizontal dentro del form.
  resultado:
    - "Desktop 1280x800: modal 760x560, columnas 350/350, SIN scroll vertical (antes scrolleaba)."
    - "Desktop 1280x600: 8px de scroll, despreciable."
    - "Tablet 768: 2 columnas parejas 326.5/326.5, sin scroll ni desborde."
    - "Mobile 375: 1 columna de 289px, cero desborde horizontal en form, modal y body."
    - "Filas finales: toggle / NOMBRE+WHATSAPP / CORREO+INTERES / FECHA+HORA / 2 checkboxes / boton / leyenda."

cambios:
  - "body.html x8: select name=country_code con los mismos 10 paises de footer.php (Chile +56 por defecto) + input de telefono nacional; WhatsApp y Correo pasan a filas propias."
  - "body.html x8: el input de fecha recibe class=at-date y autocomplete=off."
  - "at-home.css: color-scheme atado al tema para .at-cc y .at-date (el popup nativo sigue el toggle claro/oscuro); media query <=430px que le cede ancho del select al numero."
  - "at-agenda.js: helpers ymd/maxStr/outOfRange, ventana MAX_DAYS=90, min/max recalculados en cada interaccion (la pestana puede cruzar medianoche), showPicker() al hacer clic en cualquier parte del campo, y rechazo explicito de fecha pasada / fuera de ventana / invalida en renderSlots."
  - "at-home.js: helpers buildPhone() y todayISO(); submitDemo valida fecha >= hoy y arma phone = prefijo + digitos antes de enviar a n8n."

acceptance:
  criteria:
    - "El select de prefijo existe con 10 paises y Chile (+56) preseleccionado."
    - "El telefono llega a n8n en formato internacional, igual que el formulario de demo anterior."
    - "El calendario nativo es legible en tema oscuro y claro, y solo permite de hoy hasta hoy + 90 dias."
    - "Una fecha pasada nunca puede enviarse, ni escribiendola a mano."
    - "Sin desbordes horizontales en 1280px ni en 375px."
  tests:
    - "Verificacion en navegador sobre arne local que renderiza body.html igual que la plantilla PHP (arne fuera del repo, ya eliminado)."
    - "buildPhone() evaluado contra el at-home.js servido, 7 casos."
    - "node --check sobre at-home.js y at-agenda.js."
  evidence_required:
    - "Resultados registrados en result.evidence_refs de este ticket."
  rollback_plan: "Revertir por archivo; no hay backend, migraciones ni estado persistido."

