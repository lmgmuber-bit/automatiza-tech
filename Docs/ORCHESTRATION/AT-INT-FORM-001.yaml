  allow_merge: false
  allow_deploy: false
  allow_secrets: false
  allow_external_messages: false

entrega_ftp:
  nota: >
    Subir primero JS/CSS y despues los HTML. JS nuevo con markup viejo es inofensivo;
    markup nuevo con JS viejo enviaria el telefono sin prefijo.
  destino_base: "wp-content/themes/automatiza-tech/"
  orden:
