version: 2
updated_at: "2026-10-17"
owner: "Luis Miguel"

policy:
  decision_axes:
    complexity: [C0, C1, C2, C3]
    risk: [low, medium, high, critical]
    uncertainty: [low, medium, high]
    reversibility: [easy, moderate, hard]
  rules:
    - "El perfil final es el mas exigente requerido por cualquier eje."
    - "Riesgo high eleva como minimo a strong_reasoner."
    - "Riesgo critical o reversibilidad hard eleva a critical_pipeline."
    - "Incertidumbre high eleva una clase antes de elegir perfil."
    - "C3 requiere revision independiente y gate humano."
    - "No existe downgrade silencioso para high o critical."
    - "Si la plataforma no puede cambiar de modelo, debe delegar, escalar o registrar la limitacion."

classes:
  C0:
    description: "Cambio mecanico, reversible y sin impacto de comportamiento."
    examples: ["rename", "formato", "documentacion mecanica", "scaffold trivial"]
    default_profile: fast_economical
  C1:
    description: "Cambio acotado con alcance y validacion claros."
    examples: ["bug local", "feature pequena", "prueba unitaria", "ajuste UI aislado"]
    default_profile: standard_executor
  C2:
    description: "Varios modulos, debug incierto, refactor o arquitectura."
    examples: ["debug cross-system", "migracion", "refactor estructural", "diseno de API"]
    default_profile: strong_reasoner
  C3:
    description: "Accion sensible, externa, productiva o dificil de revertir."
    examples: ["auth", "pagos", "secretos", "datos productivos", "deploy", "borrado", "comunicacion externa"]
    default_profile: critical_pipeline

profiles:
  fast_economical:
    intent: "Velocidad y bajo costo para trabajo mecanico."
    independent_review: false
    human_gate: false
  standard_executor:
    intent: "Implementacion profesional acotada con pruebas."
    independent_review: false
    human_gate: false
  strong_reasoner:
    intent: "Razonamiento profundo para ambiguedad, arquitectura o debug complejo."
    independent_review: recommended
    human_gate: conditional
  critical_pipeline:
    intent: "Planificador fuerte, ejecutor controlado, revision independiente y autorizacion humana."
    independent_review: true
    human_gate: true

model_map_claude_runtime:
  note: "v2 aprobada por Luis 2026-10-17 (Shared-Tools/Router-Modelos-2026-10-17.md). IDs completos: el alias haiku resolvio a Haiku 4.5 con el CLI 2.1.284 (verificado 2026-10-17)."
  fast_economical: "claude-haiku-5-5, effort low"
  standard_executor: "claude-sonnet-5-5, effort medium"
  strong_reasoner: "claude-opus-5-5, effort high"
  critical_pipeline: "orquestador (claude-opus-5-5 o fable), effort xhigh + revision independiente + gate humano"

model_map_codex_runtime:
  note: "Plan ChatGPT Plus. Esfuerzo por defecto medium en ~/.codex/config.toml; perfil ~/.codex/profundo.config.toml (codex --profile profundo) para C3. gpt-6-astra solo a pedido de Luis."
  fast_economical: "gpt-6-luna, effort low"
  standard_executor: "gpt-6.1-sol, effort medium"
  strong_reasoner: "gpt-6.1-sol, effort xhigh"
  critical_pipeline: "codex --profile profundo (gpt-6.1-sol ultra) + revision independiente + gate humano"

enforcement:
  native_only: "Ruteo nativo de Claude Code y Codex. Proxies de terceros (OmniRoute, claude-code-router, OpenRouter) descartados 2026-10-17."
  role_defaults: "Cada cargo at-* fija model/effort en su frontmatter (Claude) o TOML (Codex); fuente compartida en Shared-Tools/at-agent-company/native/. Nexo hereda."
  escalation: "Subir de modelo es explicito: parametro model del Agent tool en Claude; valor explicito o --profile profundo en Codex. Registrar el motivo."
  delegation_floor: "Tareas de pocas llamadas las hace quien ya trabaja: delegar recarga el contexto completo."
  skill: "at-router-modelos (~/.agents/skills, enlazada en Claude, Codex y OpenCode)"
  measurement: "Shared-Tools/router-modelos/MEDICION.md; no afirmar ahorro sin medicion."

runtime_record_required:
  fields:
    - complexity
    - risk
    - uncertainty
    - reversibility
    - selected_profile
    - selected_model
    - rationale
    - independent_review
    - human_gate

portfolio:
  strategic_center: automatizatech
  note: "AT recibe peso estrategico, pero P0-P3 conserva su significado operacional."
