<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mujer Vibranza">
  <title>Mujer Vibranza — isotipo</title>
  <desc>Huella-hoja: el toque personal (huella), el bienestar (hoja) y la vibración (anillos).</desc>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Anillo exterior: hoja -->
    <path d="M50 8 C 74 31, 74 61, 50 92 C 26 61, 26 31, 50 8 Z"
          stroke="#176B5D" stroke-width="3.2"/>
    <!-- Anillo medio: la vibración se propaga -->
    <path d="M50 21 C 66.5 37, 66.5 59, 50 79 C 33.5 59, 33.5 37, 50 21 Z"
          stroke="#176B5D" stroke-width="2.6" opacity="0.72"/>
    <!-- Núcleo: la hoja late en fucsia (acento de su ambo) -->
    <path d="M50 34 C 59 43, 59 56, 50 67 C 41 56, 41 43, 50 34 Z"
          stroke="#D6307F" stroke-width="2.6"/>
  </g>
</svg>
