    <g fill="#176B5D">
      <circle cx="45" cy="21" r="12"/>
      <path d="M 53 12 C 65 14 73 22 71 32 C 70 38 64 40 59 36 C 61 30 59 21 53 12 Z"/>
      <path d="M 24 44 C 14 50 12 64 18 76 C 26 90 40 94 50 94 C 60 94 74 90 82 76 C 88 64 86 50 76 44 C 68 40 60 38 50 38 C 40 38 32 40 24 44 Z"/>
