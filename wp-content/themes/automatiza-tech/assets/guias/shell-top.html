<div id="at-root" data-motion="on" style="position:relative;width:100%;min-height:100vh;background:transparent">
  <div id="at-progress" style="position:fixed;top:0;left:0;height:3px;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#2dd4bf,#34d399);z-index:99;box-shadow:0 0 12px rgba(45,212,191,.6);transition:transform .12s linear"></div>

  <!-- ================= NAV ================= -->
  <header id="at-nav" style="position:sticky;top:0;z-index:60;width:100%;backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:background .3s,box-shadow .3s,border-color .3s">
    <div style="max-width:1200px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <a href="{{HOME_URL}}" style="display:flex;align-items:center;gap:11px">
        <img src="assets/at-logo.png" alt="AutomatizaTech" style="width:34px;height:34px;object-fit:contain">
        <span style="font-family:'Space Grotesk';font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--text)">Automatiza<span style="color:#2dd4bf">Tech</span></span>
      </a>
      <sc-if data-when="isDesktop">
        <nav style="display:flex;align-items:center;gap:34px">
          {{MENU_SERVICIOS}}
          <a href="{{HOME_URL}}#planes" style="font-size:14px;font-weight:500;color:var(--text-3);transition:color .2s" data-hover="color:var(--text)">Planes</a>
          <a href="{{HOME_URL}}#rubros" style="font-size:14px;font-weight:500;color:var(--text-3);transition:color .2s" data-hover="color:var(--text)">Casos por rubro</a>
          <button data-act="toggleTheme" aria-label="Cambiar tema" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:var(--ov2);border:1px solid var(--bd2);color:var(--text-3);cursor:pointer;transition:color .2s,border-color .2s" data-hover="color:var(--text);border-color:var(--bd3)"><sc-if data-when="isDark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if><sc-if data-when="isLight"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></sc-if></button>
          <a href="#contacto" data-act="openModal" style="display:inline-flex;align-items:center;font-family:'Space Grotesk';font-size:14px;font-weight:600;color:#061018;background:#2dd4bf;padding:10px 18px;border-radius:9px;transition:background .2s,transform .2s" data-hover="background:var(--accent-2);transform:translateY(-1px)">Agenda diagnóstico</a>
        </nav>
      </sc-if>
      <sc-if data-when="isMobile">
        <div style="display:flex;align-items:center;gap:10px">
        <button data-act="toggleTheme" aria-label="Cambiar tema" style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:9px;background:var(--ov2);border:1px solid var(--bd2);color:var(--text-3);cursor:pointer">
          <sc-if data-when="isDark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
          <sc-if data-when="isLight"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></sc-if>
        </button>
        <button data-act="toggleMenu" aria-label="Menú" style="display:flex;flex-direction:column;gap:5px;background:var(--ov2);border:1px solid var(--bd2);border-radius:9px;padding:11px;cursor:pointer">
          <span style="width:18px;height:2px;background:var(--text);border-radius:2px;display:block"></span>
          <span style="width:18px;height:2px;background:var(--text);border-radius:2px;display:block"></span>
          <span style="width:18px;height:2px;background:var(--text);border-radius:2px;display:block"></span>
        </button>
        </div>
      </sc-if>
    </div>
    <sc-if data-when="menuOpen">
      <div style="padding:8px 18px 20px;display:flex;flex-direction:column;gap:2px;background:var(--menu-bg);border-bottom:1px solid var(--bd2)">
        {{MENU_SERVICIOS_MOVIL}}
        <a href="{{HOME_URL}}#planes" data-act="closeMenu" style="padding:13px 12px;font-weight:600;color:var(--text-2);border-radius:8px">Planes</a>
        <a href="{{HOME_URL}}#rubros" data-act="closeMenu" style="padding:13px 12px;font-weight:600;color:var(--text-2);border-radius:8px">Casos por rubro</a>
        <a href="#contacto" data-act="openModal" style="margin-top:8px;text-align:center;padding:14px;font-family:'Space Grotesk';font-weight:600;color:#061018;background:#2dd4bf;border-radius:9px">Agenda tu diagnóstico gratis</a>
      </div>
    </sc-if>
  </header>
